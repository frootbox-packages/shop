# German texts of the shop for visitors addressed formally ("Sie"),
# only those that differ from de.yaml (decision 0316).
"To your orders": "Zu Ihren Bestellungen"
"Please sign in to order.": "Bitte melden Sie sich an, um zu bestellen."
"Your order reference": "Ihre Bestellreferenz"
"You are signed in as {name}.": "Sie sind angemeldet als {name}."
"Enter your email address. If it belongs to a customer, a link to set a new password will be sent to it.": "Geben Sie Ihre E-Mail-Adresse ein. Gehört sie zu einem Kundenkonto, schicken wir einen Link, mit dem Sie ein neues Passwort setzen."
"Your account": "Ihr Konto"
"Please sign in to see your account.": "Bitte melden Sie sich an, um Ihr Konto zu sehen."
"Your data": "Ihre Daten"
"Please check your entries.": "Bitte prüfen Sie Ihre Angaben."
"Your new password is set. You can sign in with it now.": "Ihr neues Passwort ist gesetzt. Sie können sich jetzt damit anmelden."
"Your password has been changed.": "Ihr Passwort wurde geändert."
"Thank you for your order {number}.": "Vielen Dank für Ihre Bestellung {number}."
"Thank you for your order.": "Vielen Dank für Ihre Bestellung."
"Please sign in to the shop.": "Bitte melden Sie sich im Shop an."
"Please agree to “{title}”.": "Bitte stimmen Sie „{title}“ zu."
"The total has changed meanwhile. Please check the order and send it again.": "Die Summe hat sich inzwischen geändert. Bitte prüfen Sie die Bestellung und schicken Sie sie noch einmal ab."
"The shop cannot be reached right now. Please try again in a moment.": "Der Shop ist gerade nicht erreichbar. Bitte versuchen Sie es gleich noch einmal."
"Please also note:": "Bitte beachten Sie auch:"
"No product matches your search.": "Kein Produkt passt zu Ihrer Suche."
