# Messages
"Please check your entries.": "Bitte prüfe Deine Angaben."
"This is no longer there.": "Das gibt es nicht mehr."
"If the address belongs to a customer, a link to set a new password is on its way.": "Gehört die Adresse zu einem Kundenkonto, ist ein Link zum Setzen eines neuen Passworts unterwegs."
