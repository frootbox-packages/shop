# Screen "Shop sync" in the backend (decision 0326)
"Shop sync": "Shop-Abgleich"
"The website keeps a copy of the catalog of {provider}: categories, products and images. Every five minutes it takes the changes.": "Die Website hält eine Kopie des Katalogs von {provider}: Kategorien, Produkte und Bilder. Alle fünf Minuten holt sie die Änderungen."
"The website keeps a copy of the catalog of the shop: categories, products and images.": "Die Website hält eine Kopie des Katalogs des Shops: Kategorien, Produkte und Bilder."
"Running": "Läuft"
"Never synced": "Noch nie abgeglichen"
"The whole catalog is being synced.": "Der ganze Katalog wird abgeglichen."
"The changes are being synced.": "Die Änderungen werden abgeglichen."
"Started:": "Begonnen:"
"{seen} of about {total} products": "{seen} von etwa {total} Produkten"
"Products changed": "Produkte geändert"
"Products removed": "Produkte entfernt"
"Categories changed": "Kategorien geändert"
"Images copied": "Bilder kopiert"
"Last sync of the whole catalog ended:": "Letzter Abgleich des ganzen Katalogs fertig:"
"Last sync ended:": "Letzter Abgleich fertig:"
"{count} image could not be copied.": { one: "{count} Bild ließ sich nicht kopieren.", other: "{count} Bilder ließen sich nicht kopieren." }
"Last reason: {reason}": "Letzter Grund: {reason}"
"{products} products in the copy, {without} of them without an image.": "{products} Produkte in der Kopie, davon {without} ohne Bild."
"A sync waits in the queue. Without cron it runs with the next tick of the hub, every five minutes.": "Ein Abgleich wartet in der Warteschlange. Ohne Cron läuft er mit dem nächsten Tick des Hubs, alle fünf Minuten."
"A sync in the background failed.": "Ein Abgleich im Hintergrund ist gescheitert."
"Sync now": "Jetzt abgleichen"
"Your browser runs the sync step by step, without waiting for the queue. Keep this page open until it is done; you can stop it at any time, and the next sync goes on from there.": "Dein Browser führt den Abgleich Schritt für Schritt aus, ohne auf die Warteschlange zu warten. Lass diese Seite offen, bis er fertig ist. Du kannst jederzeit anhalten, der nächste Abgleich macht dort weiter."
"The catalog is up to date.": "Der Katalog ist aktuell."
"Sync changes": "Änderungen abgleichen"
"Stop": "Anhalten"
"The whole catalog is synced.": "Der ganze Katalog ist abgeglichen."
"Sync the whole catalog": "Ganzen Katalog abgleichen"
"The whole catalog asks the shop for every product again, takes a while and removes products the shop no longer has. Use it when the copy is wrong, e.g. after moving the website.": "Beim ganzen Katalog fragt die Website jedes Produkt neu beim Shop ab. Das dauert eine Weile und entfernt Produkte, die der Shop nicht mehr hat. Nutze es, wenn die Kopie nicht stimmt, z. B. nach einem Umzug der Website."
"Another sync of the catalog is running right now. Try again in a moment.": "Gerade läuft schon ein Abgleich des Katalogs. Versuch es gleich noch einmal."
