# German texts of the shop: labels of the blocks, texts for visitors and the settings (decision 0311).
# Blocks
"Product catalog": "Produktkatalog"
"Our products": "Unsere Produkte"
"The catalog of the shop with categories, products and the page of each product. For a signed-in customer with prices.": "Der Katalog des Shops mit Kategorien, Produkten und der Seite jedes Produkts. Für angemeldete Kunden mit Preisen."
"Products per page": "Produkte je Seite"
"Cart": "Warenkorb"
"The cart of the visitor with the pieces of each product; for a signed-in customer with prices, shipping and the total.": "Der Warenkorb der Besucher mit der Stückzahl jedes Produkts; für angemeldete Kunden mit Preisen, Versand und Summe."
"Checkout": "Kasse"
"The checkout of the shop for a signed-in customer with delivery address, shipping, payment, the legal texts and the order.": "Die Kasse des Shops für angemeldete Kunden mit Lieferadresse, Versand, Zahlung, den rechtlichen Texten und der Bestellung."
"Sign-in to the shop": "Anmeldung im Shop"
"Customers of the shop sign in here, ask for a link when they forgot the password and set a new one.": "Hier melden sich Kunden des Shops an, fordern bei vergessenem Passwort einen Link an und setzen ein neues."
"Customer account": "Kundenkonto"
"The account of the signed-in customer of the shop with orders, invoices as PDF, addresses and the password.": "Das Konto angemeldeter Kunden des Shops mit Bestellungen, Rechnungen als PDF, Adressen und Passwort."
